
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sagar Sweets Product Master</title>
<style>
body{font-family:Arial;background:#f4f4f4;margin:0}
header{background:#7b1828;color:white;text-align:center;padding:20px}
main{max-width:600px;margin:auto;padding:15px}
.card{background:white;padding:18px;margin:15px 0;border-radius:12px}
input,select,button{width:100%;padding:13px;margin:8px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:7px;font-size:16px}
button{background:#7b1828;color:white;border:0;font-weight:bold}
.item{padding:12px;border-bottom:1px solid #ddd}
.small{width:auto;padding:8px;margin-right:5px}
</style>
</head>
<body>
<header>
<h2>SAGAR SWEETS</h2>
<p>Product Master</p>
</header>
<main>
<div class="card" id="login">
<h3>Admin Login (Demo)</h3>
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div id="panel" style="display:none">
<div class="card">
<h3>Add New Product</h3>
<input id="code" placeholder="Product Code">
<input id="name" placeholder="Product Name">
<input id="size" placeholder="Size (Example: 500 GM)">
<select id="unit">
<option value="KG">KG</option>
<option value="Box">Box</option>
<option value="PCS">PCS</option>
</select>
<button onclick="addProduct()">Save Product</button>
</div>

<div class="card">
<h3>Product List</h3>
<div id="list"></div>
</div>

<div class="card">
<h3>Product Dropdown Test</h3>
<select id="productSelect">
<option value="">Select Product</option>
</select>
</div>
<button onclick="logout()">Logout</button>
</div>
</main>
<script>
let products=JSON.parse(localStorage.getItem("sagarProducts")||"[]");

function login(){
if(document.getElementById("username").value==="admin" &&
document.getElementById("password").value==="admin123"){
document.getElementById("login").style.display="none";
document.getElementById("panel").style.display="block";
render();
}else alert("Demo Login: admin / admin123");
}

function addProduct(){
let code=document.getElementById("code").value.trim();
let name=document.getElementById("name").value.trim();
let size=document.getElementById("size").value.trim();
let unit=document.getElementById("unit").value;

if(!code||!name||!size){
alert("Sabhi details bharein");
return;
}
if(products.some(p=>p.code.toLowerCase()===code.toLowerCase())){
alert("Product Code already exists");
return;
}
products.push({code,name,size,unit});
save();
document.getElementById("code").value="";
document.getElementById("name").value="";
document.getElementById("size").value="";
alert("Product Saved");
}

function save(){
localStorage.setItem("sagarProducts",JSON.stringify(products));
render();
}

function render(){
document.getElementById("list").innerHTML="";
let select=document.getElementById("productSelect");
select.innerHTML='<option value="">Select Product</option>';
products.forEach((p,i)=>{
let div=document.createElement("div");
div.className="item";
div.textContent=p.code+" | "+p.name+" | "+p.size+" | "+p.unit+" ";
let edit=document.createElement("button");
edit.className="small";
edit.textContent="Edit";
edit.onclick=()=>editProduct(i);
let del=document.createElement("button");
del.className="small";
del.textContent="Delete";
del.onclick=()=>deleteProduct(i);
div.append(edit,del);
document.getElementById("list").append(div);
let option=document.createElement("option");
option.value=p.code;
option.textContent=p.name+" - "+p.size;
select.append(option);
});
}

function editProduct(i){
let p=products[i];
let name=prompt("Product Name",p.name);
if(name===null)return;
let size=prompt("Size",p.size);
if(size===null)return;
products[i]={...p,name:name.trim(),size:size.trim()};
save();
}

function deleteProduct(i){
if(confirm("Delete this product?")){
products.splice(i,1);
save();
}
}

function logout(){
location.reload();
}
</script>
</body>
</html>
