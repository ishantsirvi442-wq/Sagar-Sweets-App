<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sagar Sweets Inventory</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f5f9;color:#222}
header{background:#7b1828;color:white;padding:22px;text-align:center}
header h2{margin:0}
.container{padding:18px;max-width:600px;margin:auto}
.card{background:white;padding:18px;margin:15px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}
input,select,button{width:100%;padding:13px;margin:9px 0;border:1px solid #ccc;border-radius:7px;font-size:16px}
button{background:#7b1828;color:white;border:0;font-weight:bold}
h3{color:#7b1828}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h2>SAGAR SWEETS</h2>
<p>Inventory Management System</p>
</header>

<div class="container">

<div class="card" id="login">
<h3>Login</h3>
<select id="role">
<option value="">Select Login Type</option>
<option value="admin">Admin</option>
<option value="branch">Branch</option>
<option value="factory">Factory</option>
</select>

<select id="branch">
<option value="">Select Branch</option>
<option>Gangapur Road</option>
<option>Govind Nagar</option>
<option>Tapovan</option>
<option>College Road</option>
<option>Ashoka Marg</option>
</select>

<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<button onclick="loginUser()">Login</button>
</div>

<div id="dashboard" class="hidden">
<div class="card">
<h3>Welcome to Sagar Sweets</h3>
<p id="welcome"></p>
<button onclick="showStock()">Stock Management</button>
<button onclick="logout()">Logout</button>
</div>

<div class="card hidden" id="stock">
<h3>Stock Entry</h3>
<input type="date" id="date">
<select id="product">
<option value="">Select Product</option>
</select>
<input type="number" id="qty" placeholder="Quantity">
<select id="unit">
<option>KG</option>
<option>Box</option>
<option>PCS</option>
</select>
<button onclick="saveStock()">Save Entry</button>
<h3>Stock Entries</h3>
<div id="entries"></div>
</div>
</div>
</div>

<script>
let currentRole="";
let currentBranch="";

function loginUser(){
let role=document.getElementById("role").value;
let branch=document.getElementById("branch").value;
let user=document.getElementById("username").value;
let pass=document.getElementById("password").value;

if(!role || !user || !pass){
alert("Please fill all details");
return;
}
if(role==="branch" && !branch){
alert("Select Branch");
return;
}

currentRole=role;
currentBranch=branch;
document.getElementById("login").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");
document.getElementById("welcome").innerText=
role==="admin"?"Admin Login":role==="factory"?"Factory Login":branch+" Login";
}

function showStock(){
document.getElementById("stock").classList.remove("hidden");
}

function saveStock(){
let product=document.getElementById("product").value;
let qty=document.getElementById("qty").value;
let unit=document.getElementById("unit").value;
let date=document.getElementById("date").value;

if(!product || !qty || !date){
alert("Fill all stock details");
return;
}
let data=JSON.parse(localStorage.getItem("sagarStock")||"[]");
data.push({date,product,qty,unit,branch:currentBranch});
localStorage.setItem("sagarStock",JSON.stringify(data));
showEntries();
alert("Stock Entry Saved");
}

function showEntries(){
let data=JSON.parse(localStorage.getItem("sagarStock")||"[]");
document.getElementById("entries").innerHTML=data.map(x=>
`<p>${x.date} | ${x.branch} | ${x.product} | ${x.qty} ${x.unit}</p>`
).join("");
}

function logout(){
location.reload();
}
</script>
</body>
</html>
